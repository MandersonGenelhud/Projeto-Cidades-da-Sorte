<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Loteamento · Migra</title>
  <link rel="icon" href="/img/migra-emblema.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/site/site.css" />
</head>
<body>
  <div class="wrap" style="padding-top:24px">
    <p class="small"><a href="/imoveis#loteamentos">← Todos os loteamentos</a></p>
    <h1 id="name" style="font-size:clamp(24px,3.5vw,34px);letter-spacing:-.02em;margin:6px 0 2px"></h1>
    <p class="muted" id="loc" style="margin:0"></p>
  </div>
  <main class="wrap map-layout" id="page">
    <div>
      <div class="map-tools">
        <div class="counts" id="counts"></div>
        <span style="flex:1"></span>
        <label class="check"><input type="checkbox" id="onlyAvail" /> Destacar só os disponíveis</label>
        <div class="seg"><button id="zoomOut" aria-label="Diminuir">−</button><span id="zoomLevel">100%</span><button id="zoomIn" aria-label="Aumentar">+</button></div>
        <button class="btn small" id="fullMap">Tela cheia</button>
      </div>
      <div class="map-scroll" id="mapScroll"><div class="map" id="map"></div></div>
      <p class="muted small">Toque em um lote para ver a área, o valor e reservar. Use o + para ampliar e ler os números das quadras e dos lotes.</p>
      <div id="desc" style="white-space:pre-wrap;margin-top:12px"></div>
    </div>
    <aside class="side">
      <div class="box lot-info" id="lotBox">
        <h3>Escolha um lote no mapa</h3>
        <p class="muted">Os lotes em verde estão disponíveis. Toque em um para ver os detalhes.</p>
      </div>
    </aside>
  </main>
  <script src="/site/site.js"></script>
  <script src="/site/lotgeo.js"></script>
  <script>
    siteChrome('lotes');
    const slug = decodeURIComponent(location.pathname.split('/').pop());
    let dev;
    let zoom = 1;
    const ratio = () => dev.planRatio || 4 / 3;
    function renderMap() {
      const only = $('#onlyAvail').checked;
      const base = dev.plan ? `<img src="${esc(dev.plan)}" alt="Planta do loteamento ${esc(dev.name)}" />` : '<div class="noplan"></div>';
      $('#map').style.width = `${zoom * 100}%`;
      $('#zoomLevel').textContent = `${Math.round(zoom * 100)}%`;
      $('#map').innerHTML = `${base}
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="Mapa dos lotes">
          ${dev.lots.map((l) => `<path class="lot ${l.status}${only && l.status !== 'disponivel' ? ' dim' : ''}" data-id="${l.id}" d="${LotGeo.roundedPath(l.shape, ratio())}"><title>${esc(l.code)} · ${STATUS[l.status]}</title></path>`).join('')}
        </svg><div id="labels"></div>`;
      const img = $('#map img');
      if (img && !img.complete) img.addEventListener('load', renderLabels, { once: true });
      renderLabels();
    }
    /** Números dos lotes com a letra no tamanho do lote, e o nome de cada quadra. */
    function renderLabels() {
      const w = $('#map').clientWidth;
      const r = ratio();
      const blocks = {};
      $('#labels').innerHTML = dev.lots.map((l) => {
        const { area, center: [x, y] } = LotGeo.polyInfo(l.shape, r);
        if (l.block) (blocks[l.block] ||= []).push([x, y]);
        const side = (Math.sqrt(area) * w) / (100 * r);
        return side < 12 ? '' : `<span class="lot-label" style="left:${x}%;top:${y}%;font-size:${Math.max(8, Math.min(18, side * 0.4)).toFixed(1)}px">${esc(l.number || l.code)}</span>`;
      }).join('') + Object.entries(blocks).filter(([, p]) => p.length > 1).map(([b, p]) => {
        const [x, y] = p.reduce(([sx, sy], [px, py]) => [sx + px / p.length, sy + py / p.length], [0, 0]);
        return `<span class="block-label" style="left:${x}%;top:${y}%">Quadra ${esc(b)}</span>`;
      }).join('');
    }
    function setZoom(z, keepCenter = true) {
      const box = $('#mapScroll');
      const cx = (box.scrollLeft + box.clientWidth / 2) / box.scrollWidth;
      const cy = (box.scrollTop + box.clientHeight / 2) / box.scrollHeight;
      zoom = Math.min(6, Math.max(1, z));
      renderMap();
      if (keepCenter) { box.scrollLeft = cx * box.scrollWidth - box.clientWidth / 2; box.scrollTop = cy * box.scrollHeight - box.clientHeight / 2; }
    }
    function selectLot(id) {
      const l = dev.lots.find((x) => x.id === id);
      if (!l) return;
      $$('.lot').forEach((p) => p.classList.toggle('sel', p.dataset.id === id));
      const free = l.status === 'disponivel';
      $('#lotBox').innerHTML = `
        <span class="st"><i class="dot ${l.status}"></i> ${STATUS[l.status]}</span>
        <h2 style="margin:6px 0 2px">${esc(l.code)}</h2>
        <p class="muted" style="margin:0">${esc([l.block && `Quadra ${l.block}`, l.number && `Lote ${l.number}`].filter(Boolean).join(' · '))}</p>
        <div class="facts-list">${l.area ? `<div><b>${Number(l.area).toLocaleString('pt-BR')} m²</b><span>Área</span></div>` : ''}<div><b>${free || l.status === 'reservado' ? price(l.price, dev.currency) : '—'}</b><span>Valor</span></div></div>
        ${free ? '<button class="btn primary block" id="btnLot">Quero este lote</button><p class="muted small">Um corretor confirma a disponibilidade e faz a reserva para você.</p>'
          : l.status === 'reservado' ? '<button class="btn block" id="btnLot">Avise-me se for liberado</button>'
          : l.status === 'loteadora' ? '<p class="muted">Este lote está reservado pela loteadora e não está à venda. Veja os lotes em verde.</p>' : '<p class="muted">Este lote já foi vendido. Veja os lotes em verde.</p>'}`;
      const btn = $('#btnLot');
      if (btn) btn.onclick = () => openInterest({ title: `${dev.name} · ${l.code}`, kind: 'lot', slug: dev.slug, lotId: l.id });
      if (matchMedia('(max-width: 960px)').matches) $('#lotBox').scrollIntoView({ behavior: 'smooth' });
    }
    (async () => {
      const [d, c] = await Promise.all([api(`/api/public/development/${encodeURIComponent(slug)}`), api('/api/public/catalog')]);
      dev = d;
      setHeaderWhatsapp(d.agentWhatsapp || c.whatsapp);
      document.title = `${d.name} · Migra Imóveis`;
      $('#name').textContent = d.name;
      $('#loc').textContent = [d.address, d.city, 'Paraguai'].filter(Boolean).join(' · ');
      $('#desc').textContent = d.description || '';
      $('#counts').innerHTML = `<span><i class="dot disponivel"></i> ${d.summary.disponivel} disponíveis</span><span><i class="dot reservado"></i> ${d.summary.reservado} reservados</span><span><i class="dot vendido"></i> ${d.summary.vendido} vendidos</span>${d.summary.loteadora ? `<span><i class="dot loteadora"></i> ${d.summary.loteadora} da loteadora</span>` : ''}`;
      renderMap();
    })().catch((e) => { $('#page').innerHTML = `<div class="empty" style="grid-column:1/-1">${esc(e.message)} · <a href="/imoveis">ver imóveis</a></div>`; });
    $('#map').addEventListener('click', (e) => { const id = e.target.closest('.lot')?.dataset.id; if (id) selectLot(id); });
    $('#onlyAvail').addEventListener('change', renderMap);
    $('#zoomIn').onclick = () => setZoom(zoom + 0.5);
    $('#zoomOut').onclick = () => setZoom(zoom - 0.5);
    $('#fullMap').onclick = () => { const el = $('#mapScroll'); document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen?.().catch(() => {}); };
    addEventListener('resize', () => dev && renderLabels());
    document.addEventListener('fullscreenchange', () => dev && renderLabels());
  </script>
</body>
</html>
