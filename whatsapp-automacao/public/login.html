<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar · Migra Hub</title>
  <link rel="icon" href="img/migra-emblema.png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
    .login { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 0 28px 28px; display: grid; gap: 14px; overflow: hidden; }
    .login .hero { margin: 0 -28px; padding: 22px 28px; background: var(--sidebar); text-align: center; }
    .login .hero img { width: min(240px, 80%); height: auto; }
    .login .hero small { display: block; color: #cfe8d6; margin-top: 6px; }
    .login h1 { margin: 0; font-size: 22px; }
    .login .brand { display: flex; gap: 10px; align-items: center; }
    .login .brand span { font-size: 30px; }
    .login button { justify-content: center; }
    .err { color: var(--red); font-size: 14px; min-height: 1em; }
  </style>
</head>
<body>
  <form class="login form" id="form">
    <div class="hero"><img src="/brand/logo" alt="Logo" /><small id="loginName">Migra Hub · Atendimento e vendas</small></div>
    <p id="intro" class="hint">Entre com o seu login e senha.</p>
    <label id="nameWrap" hidden>Seu nome <input name="name" autocomplete="name" /></label>
    <label>Login <input name="login" autocomplete="username" required placeholder="ex.: marcos" /></label>
    <label>Senha <input name="password" type="password" autocomplete="current-password" required minlength="6" /></label>
    <label id="codeWrap" hidden>Código do app autenticador (6 números) <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" /></label>
    <label id="waWrap" hidden>Seu WhatsApp (para receber avisos de retorno) <input name="whatsapp" placeholder="+595 981 123456" /></label>
    <p class="err" id="err"></p>
    <button class="btn primary" id="btn">Entrar</button>
  </form>
  <script>
    const form = document.getElementById('form');
    let setup = false;
    const back = () => `/${new URLSearchParams(location.search).get('volta') || ''}`;
    fetch('/api/brand').then((r) => r.json()).then((b) => {
      document.getElementById('loginName').textContent = `${b.name || 'Migra Hub'} · ${b.tagline || 'Atendimento e vendas'}`;
      document.title = `Entrar · ${b.name || 'Migra Hub'}`;
    }).catch(() => {});
    fetch('/api/auth/state').then((r) => r.json()).then((s) => {
      if (s.user) return (location.href = back());
      setup = s.needsSetup;
      if (setup) {
        document.getElementById('intro').textContent = 'Primeiro acesso: crie a conta do administrador (o dono da empresa). Depois ele cadastra os vendedores.';
        document.getElementById('nameWrap').hidden = false;
        document.getElementById('waWrap').hidden = false;
        form.name.required = true;
        form.password.autocomplete = 'new-password';
        document.getElementById('btn').textContent = 'Criar administrador e entrar';
      }
    });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(form));
      const res = await fetch(setup ? '/api/auth/setup' : '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) return (document.getElementById('err').textContent = data.error || 'Não foi possível entrar');
      if (data.needs2fa) {
        // Verificação em duas etapas: pede o código do app e envia de novo.
        document.getElementById('codeWrap').hidden = false;
        form.code.required = true;
        form.code.focus();
        document.getElementById('err').textContent = '';
        document.getElementById('intro').textContent = 'Digite o código de 6 números que aparece agora no seu app autenticador.';
        return;
      }
      location.href = back();
    });
  </script>
</body>
</html>
