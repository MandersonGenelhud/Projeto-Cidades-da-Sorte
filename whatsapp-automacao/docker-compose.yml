# Sobe o painel + agente. Na VPS: docker compose up -d
services:
  zapauto:
    build: .
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"] # o programa nunca ganha mais poder do que começou
    cap_drop: ["ALL"] # roda como usuário comum e sem nenhum poder especial do sistema
    env_file: .env
    environment:
      HOST: 0.0.0.0
      UPDATER: "off" # na VPS a atualização é pelo script deploy/atualizar-vps.sh (o código vem da imagem)
      # Voz da Nina (faster-whisper entende o áudio, kokoro-onnx fala). Rodam na própria VPS, só na rede interna.
      STT_URL: http://voz:9000
      TTS_URL: http://voz:9000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/auth/state"]
      interval: 30s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:3000:3000" # exposto só localmente; o Caddy publica com HTTPS
    volumes:
      - zapauto_data:/app/data

  # Serviço de voz (opcional): sem ele a Nina atende só por texto. Baixa os modelos na primeira vez (~1 GB) e guarda no volume.
  voz:
    build: ./deploy/voz
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      WHISPER_MODEL: small
    volumes:
      - voz_models:/models
    # Sem "ports": só o sistema enxerga este serviço (rede interna do Docker).

  # HTTPS automático (necessário para o webhook da Meta).
  # Troque SEU_DOMINIO no Caddyfile e aponte o DNS para a VPS.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - zapauto

volumes:
  voz_models:
  zapauto_data:
  caddy_data:
