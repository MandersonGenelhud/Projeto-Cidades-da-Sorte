name: Embaixadores - PHP e protótipo
on:
  push:
    branches: ["feat/embaixadores-atribuicao-direta-20261017"]
  pull_request:
    paths:
      - "modulos/embaixadores/**"
      - ".github/workflows/embaixadores-checks.yml"
jobs:
  validar-modulo:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ariquemes_test
          MYSQL_ROOT_PASSWORD: senha-apenas-local
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psenha-apenas-local"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      ADS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=ariquemes_test;charset=utf8mb4
      ADS_TEST_USER: root
      ADS_TEST_PASSWORD: senha-apenas-local
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe PHP
        run: |
          php -l modulos/embaixadores/Rules.php
          php -l modulos/embaixadores/ReferralService.php
          php -l modulos/embaixadores/tests/rules_test.php
          php -l modulos/embaixadores/tests/integration_test.php
      - name: Executar testes das regras
        run: php modulos/embaixadores/tests/rules_test.php
      - name: Preparar banco MySQL descartável
        run: mysql --host=127.0.0.1 --port=3306 --user=root --password="$ADS_TEST_PASSWORD" ariquemes_test < modulos/embaixadores/schema.mysql.sql
      - name: Teste integrado de comissão sobre compra com créditos
        run: php modulos/embaixadores/tests/integration_test.php
      - name: Verificar sintaxe JavaScript do painel
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('modulos/embaixadores/painel-demo.html','utf8');const m=html.match(/<script>([\s\S]*?)<\/script>/);if(!m)throw new Error('Script não encontrado');new Function(m[1]);console.log('JS ok')"
